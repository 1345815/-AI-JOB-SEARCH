version: "3.8"

services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DB_PATH=/app/data/careerpilot.db
      - SETTINGS_FILE=/app/data/settings.json
      - SESSION_MAX_AGE_DAYS=${SESSION_MAX_AGE_DAYS:-7}
      - MAX_JSON_BODY_BYTES=${MAX_JSON_BODY_BYTES:-1048576}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-5}
      - LOGIN_RATE_WINDOW_SECONDS=${LOGIN_RATE_WINDOW_SECONDS:-900}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-1}
      - BACKUP_DIR=/app/data/backups
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-14}
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_ENABLED=${LLM_ENABLED:-}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # JobHuntBot：独立看板容器（Node 零依赖），端口 8420，数据随宿主机目录持久化
  jobhuntbot:
    build: ./tools/jobhuntbot
    ports:
      - "${JOBHUNTBOT_PORT:-8420}:8420"
    volumes:
      - ./tools/jobhuntbot/dashboard:/app/dashboard
    restart: unless-stopped
