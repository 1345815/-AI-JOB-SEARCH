version: "3.8"

services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DB_PATH=/app/data/careerpilot.db
      - SESSION_MAX_AGE_DAYS=${SESSION_MAX_AGE_DAYS:-7}
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_ENABLED=${LLM_ENABLED:-}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
