[pytest]
# 用系统临时目录作为 pytest basetemp：
# 项目内 basetemp 会触发 Windows 沙箱的批量删除保护（>50 文件需确认），
# 导致全量测试 setup 清理失败（safe-delete SAFE_DELETE_BULK_CONFIRM_REQUIRED）。
# 系统 TEMP 目录是沙箱豁免区，清理不会被打断。
# 注意：路径必须用正斜杠——ini 解析会把反斜杠当转义符吞掉。
addopts = --basetemp=C:/Users/hp/AppData/Local/Temp/careerpilot-pytest
testpaths = tests
